name: Apply Papa Golf Update

on:
  push:
    branches:
      - main
    paths:
      - 'papa-golf-update.zip'
      - 'papa-golf-update-v*.zip'

  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Find update package
        id: package
        shell: bash
        run: |
          PACKAGE="$(ls -1t papa-golf-update-v*.zip papa-golf-update.zip 2>/dev/null | head -n 1 || true)"
          if [ -n "$PACKAGE" ] && [ -f "$PACKAGE" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "file=$PACKAGE" >> "$GITHUB_OUTPUT"
            echo "Using update package: $PACKAGE"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract Papa Golf update
        if: steps.package.outputs.found == 'true'
        run: |
          rm -rf /tmp/papa-golf-update
          mkdir -p /tmp/papa-golf-update
          unzip -q -o "${{ steps.package.outputs.file }}" -d /tmp/papa-golf-update

      - name: Apply update files
        if: steps.package.outputs.found == 'true'
        run: |
          rsync -av \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='papa-golf-update.zip' \
            --exclude='papa-golf-update-v*.zip' \
            /tmp/papa-golf-update/ ./

      - name: Remove temporary update package
        if: steps.package.outputs.found == 'true'
        run: |
          rm -f "${{ steps.package.outputs.file }}"

      - name: Commit updated Papa Golf files
        if: steps.package.outputs.found == 'true'
        run: |
          git config user.name "Papa Golf Update Bot"
          git config user.email "actions@github.com"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Apply Papa Golf update"
            git push
          fi
